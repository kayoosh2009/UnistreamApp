<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Profile - my unistream blog</title>
  <link rel="icon" href="icons/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="header-back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="header-center">
      <span class="header-title">Profile</span>
    </div>

    <div class="header-right">
      <a href="settings.html" class="header-settings-btn">
        <img src="icons/setting.png" alt="Settings" class="header-icon-btn">
      </a>
    </div>
  </header>

  <main class="profile-container">
    <div class="profile-banner-wrapper">
      <img id="profileBanner" src="icons/stock.png" alt="Banner" class="profile-banner">
      <div class="profile-avatar-wrapper">
        <img id="profileAvatar" src="icons/stock.png" alt="Avatar" class="profile-avatar" referrerpolicy="no-referrer">
      </div>
    </div>

    <div class="profile-user-info">
      <h2 id="profileDisplayName" class="profile-name">User Name</h2>
      <span id="profileUsername" class="profile-username">@username</span>
    </div>

    <div class="profile-stats-card">
      <div class="stat-item">
        <span class="stat-number" id="statTotalViews">0</span>
        <span class="stat-label">Total Views</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="statPostsCount">0</span>
        <span class="stat-label">Posts</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="statViewedPosts">0</span>
        <span class="stat-label">Viewed</span>
      </div>
    </div>

    <div class="profile-tabs">
      <button class="profile-tab active" id="tabPosts">Posts</button>
      <button class="profile-tab" id="tabChats">Chats</button>
    </div>

    <div class="profile-content-section" id="sectionPosts">
      <div id="userPostsFeed" class="user-posts-feed">
        <p class="empty-state">No posts yet</p>
      </div>
    </div>

    <div class="profile-content-section hidden" id="sectionChats">
      <div id="userChatsFeed" class="user-chats-feed">
        <p class="empty-state">No chats yet</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='profile.html'">
      <img src="icons/profile.png" alt="Profile">
    </button>
    <button class="nav-btn btn-add" id="btnAddPost" onclick="window.location.href='add-post.html'">
      <img src="icons/add.png" alt="Add post">
    </button>
    <button class="nav-btn" onclick="window.location.href='index.html'">
      <img src="icons/logo.png" alt="Feed">
    </button>
  </nav>

  <script type="module">
    import { auth, onAuthStateChanged, db, doc, getDoc, deleteDoc, collection, query, where, orderBy, onSnapshot } from './firebase.js';

    const profileBanner = document.getElementById('profileBanner');
    const profileAvatar = document.getElementById('profileAvatar');
    const profileDisplayName = document.getElementById('profileDisplayName');
    const profileUsername = document.getElementById('profileUsername');
    const statPostsCount = document.getElementById('statPostsCount');
    const userPostsFeed = document.getElementById('userPostsFeed');

    // Instant local cache restore ⚡
    const cachedProfile = JSON.parse(localStorage.getItem('user_cached_profile') || 'null');
    if (cachedProfile) {
      if (cachedProfile.avatarUrl) profileAvatar.src = cachedProfile.avatarUrl;
      if (cachedProfile.bannerUrl) profileBanner.src = cachedProfile.bannerUrl;
      if (cachedProfile.displayName) profileDisplayName.textContent = cachedProfile.displayName;
      if (cachedProfile.username) profileUsername.textContent = '@' + cachedProfile.username;
    }

    const tabPosts = document.getElementById('tabPosts');
    const tabChats = document.getElementById('tabChats');
    const sectionPosts = document.getElementById('sectionPosts');
    const sectionChats = document.getElementById('sectionChats');

    tabPosts.addEventListener('click', () => {
      tabPosts.classList.add('active');
      tabChats.classList.remove('active');
      sectionPosts.classList.remove('hidden');
      sectionChats.classList.add('hidden');
    });

    tabChats.addEventListener('click', () => {
      tabChats.classList.add('active');
      tabPosts.classList.remove('active');
      sectionChats.classList.remove('hidden');
      sectionPosts.classList.add('hidden');
    });

    function formatTimeAgo(timestamp) {
      if (!timestamp) return 'just now';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const diffSec = Math.floor((new Date() - date) / 1000);

      if (diffSec < 60) {
        return diffSec <= 1 ? '1 second ago' : `${diffSec} seconds ago`;
      }
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) {
        return diffMin === 1 ? '1 minute ago' : `${diffMin} minutes ago`;
      }
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) {
        return diffHours === 1 ? '1 hour ago' : `${diffHours} hours ago`;
      }
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) {
        return diffDays === 1 ? '1 day ago' : `${diffDays} days ago`;
      }
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.post-menu-wrapper')) {
        document.querySelectorAll('.post-dropdown-menu.active').forEach(m => m.classList.remove('active'));
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      if (user.photoURL) {
        profileAvatar.src = user.photoURL;
      }

      profileDisplayName.textContent = user.displayName || 'Anonymous User';
      profileUsername.textContent = '@' + (user.email ? user.email.split('@')[0] : 'user');

      // Fetch personalized user document & sync cache
      try {
        const userDocRef = doc(db, 'users', user.uid);
        const userDocSnap = await getDoc(userDocRef);
        if (userDocSnap.exists()) {
          const data = userDocSnap.data();
          if (data.displayName) profileDisplayName.textContent = data.displayName;
          if (data.username) profileUsername.textContent = '@' + data.username;
          if (data.avatarUrl) profileAvatar.src = data.avatarUrl;
          if (data.bannerUrl) profileBanner.src = data.bannerUrl;

          localStorage.setItem('user_cached_profile', JSON.stringify({
            displayName: data.displayName || user.displayName || '',
            username: data.username || (user.email ? user.email.split('@')[0] : 'user'),
            avatarUrl: data.avatarUrl || user.photoURL || 'icons/stock.png',
            bannerUrl: data.bannerUrl || 'icons/stock.png'
          }));
        }
      } catch (err) {
        console.error("Profile load error:", err);
      }

      // Load user's own posts
      const userPostsQuery = query(
        collection(db, 'posts'),
        where('authorId', '==', user.uid)
      );

      onSnapshot(userPostsQuery, (snapshot) => {
        userPostsFeed.innerHTML = '';
        statPostsCount.textContent = snapshot.size;

        if (snapshot.empty) {
          userPostsFeed.innerHTML = '<p class="empty-state">No posts yet</p>';
          return;
        }

        const sortedDocs = [...snapshot.docs].sort((a, b) => {
          const aTime = a.data().createdAt ? a.data().createdAt.toMillis() : 0;
          const bTime = b.data().createdAt ? b.data().createdAt.toMillis() : 0;
          return bTime - aTime;
        });

        sortedDocs.forEach((postDoc) => {
          const post = postDoc.data();
          const postId = postDoc.id;
          const likesCount = (post.likes || []).length;
          const commentsCount = post.commentsCount || 0;
          const viewsCount = post.views || 0;

          const postElement = document.createElement('div');
          postElement.className = 'post';
          postElement.innerHTML = `
            <div class="post-header">
              <div class="post-author-box">
                <img src="${post.authorAvatar || 'icons/stock.png'}" class="post-author-avatar" referrerpolicy="no-referrer" onerror="this.src='icons/stock.png'">
                <div class="post-author-details">
                  <span class="post-author-name">${post.authorName || 'User'}</span>
                  <span class="post-time">${formatTimeAgo(post.createdAt)}</span>
                </div>
              </div>
              <div class="post-header-actions">
                <span class="post-id">#${post.postNumber || '1'}</span>
                <div class="post-menu-wrapper">
                  <button class="post-menu-btn" data-id="${postId}">
                    <img src="icons/post-menu.png" alt="Options">
                  </button>
                  <div class="post-dropdown-menu" id="menu-${postId}">
                    <button class="dropdown-item edit-btn" disabled>Edit</button>
                    <button class="dropdown-item delete delete-btn" data-id="${postId}">Delete</button>
                  </div>
                </div>
              </div>
            </div>
            ${post.text ? `<p class="post-text">${post.text}</p>` : ''}
            ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-attachment-img" alt="Post photo">` : ''}
            <div class="post-footer">
              <div class="post-action-btn">
                <img src="icons/heart-off.png" alt="Like">
                <span>${likesCount}</span>
              </div>
              <div class="post-action-btn">
                <img src="icons/coment.png" alt="Comments">
                <span>${commentsCount}</span>
              </div>
              <div class="post-action-btn">
                <img src="icons/view.png" alt="Views">
                <span>${viewsCount}</span>
              </div>
            </div>
          `;

          const menuBtn = postElement.querySelector('.post-menu-btn');
          const dropdownMenu = postElement.querySelector(`#menu-${postId}`);
          menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.post-dropdown-menu.active').forEach(m => {
              if (m !== dropdownMenu) m.classList.remove('active');
            });
            dropdownMenu.classList.toggle('active');
          });

          const deleteBtn = postElement.querySelector('.delete-btn');
          deleteBtn.addEventListener('click', async () => {
            dropdownMenu.classList.remove('active');
            try {
              await deleteDoc(doc(db, 'posts', postId));
            } catch (err) {
              console.error("Failed to delete post:", err);
            }
          });

          userPostsFeed.appendChild(postElement);
        });
      });
    });
  </script>
</body>
</html>
