<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Profile - my unistream blog</title>
  <link rel="icon" href="icons/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="header-back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="header-center">
      <span class="header-title">Profile</span>
    </div>

    <div class="header-right"></div>
  </header>

  <main class="profile-container">
    <div class="profile-banner-wrapper">
      <img id="profileBanner" src="icons/stock.png" alt="Banner" class="profile-banner">
      <div class="profile-avatar-wrapper">
        <img id="profileAvatar" src="icons/stock.png" alt="Avatar" class="profile-avatar" referrerpolicy="no-referrer">
      </div>
    </div>

    <div class="profile-user-info">
      <h2 id="profileDisplayName" class="profile-name">User Name</h2>
      <span id="profileUsername" class="profile-username">@username</span>
    </div>

    <div class="profile-stats-card">
      <div class="stat-item">
        <span class="stat-number" id="statTotalViews">0</span>
        <span class="stat-label">Total Views</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="statPostsCount">0</span>
        <span class="stat-label">Posts</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="statViewedPosts">0</span>
        <span class="stat-label">Viewed</span>
      </div>
    </div>

    <div class="profile-posts-section">
      <h3 class="section-title">Posts</h3>
      <div id="userPostsFeed" class="user-posts-feed">
        <p class="empty-state">No posts yet</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='profile.html'">
      <img src="icons/profile.png" alt="Profile">
    </button>
    <button class="nav-btn btn-add" id="btnAddPost" onclick="window.location.href='add-post.html'">
      <img src="icons/add.png" alt="Add post">
    </button>
    <button class="nav-btn" onclick="window.location.href='index.html'">
      <img src="icons/logo.png" alt="Feed">
    </button>
  </nav>

  <script type="module">
    import { auth, onAuthStateChanged, db, collection, query, where, orderBy, onSnapshot } from './firebase.js';

    const profileAvatar = document.getElementById('profileAvatar');
    const profileDisplayName = document.getElementById('profileDisplayName');
    const profileUsername = document.getElementById('profileUsername');
    const statPostsCount = document.getElementById('statPostsCount');
    const userPostsFeed = document.getElementById('userPostsFeed');

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      if (user.photoURL) {
        profileAvatar.src = user.photoURL;
      }

      profileDisplayName.textContent = user.displayName || 'Anonymous User';
      profileUsername.textContent = '@' + (user.email ? user.email.split('@')[0] : 'user');

      // Load user's own posts
      const userPostsQuery = query(
        collection(db, 'posts'),
        where('authorId', '==', user.uid),
        orderBy('createdAt', 'desc')
      );

      onSnapshot(userPostsQuery, (snapshot) => {
        userPostsFeed.innerHTML = '';
        statPostsCount.textContent = snapshot.size;

        if (snapshot.empty) {
          userPostsFeed.innerHTML = '<p class="empty-state">No posts yet</p>';
          return;
        }

        snapshot.forEach((postDoc) => {
          const post = postDoc.data();
          const likesCount = (post.likes || []).length;
          const commentsCount = post.commentsCount || 0;
          const viewsCount = post.views || 0;

          const postElement = document.createElement('div');
          postElement.className = 'post';
          postElement.innerHTML = `
            <div class="post-header">
              <div class="post-author-box">
                <img src="${post.authorAvatar || 'icons/stock.png'}" class="post-author-avatar" referrerpolicy="no-referrer" onerror="this.src='icons/stock.png'">
                <span class="post-author-name">${post.authorName || 'User'}</span>
              </div>
              <span class="post-id">#${post.postNumber || '1'}</span>
            </div>
            <p class="post-text">${post.text}</p>
            <div class="post-footer">
              <div class="post-action-btn">
                <img src="icons/heart-off.png" alt="Like">
                <span>${likesCount}</span>
              </div>
              <div class="post-action-btn">
                <img src="icons/coment.png" alt="Comments">
                <span>${commentsCount}</span>
              </div>
              <div class="post-action-btn">
                <img src="icons/view.png" alt="Views">
                <span>${viewsCount}</span>
              </div>
            </div>
          `;
          userPostsFeed.appendChild(postElement);
        });
      });
    });
  </script>
</body>
</html>
