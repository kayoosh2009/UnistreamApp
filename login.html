<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - my unistream blog</title>
  <link rel="icon" href="icons/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <img src="icons/logo-bold.png" alt="Logo" class="login-logo">
    </div>
    
    <p class="login-tagline">Join our cozy community space</p>

    <button id="btnGoogleLogin" class="google-login-btn">
      <img src="icons/google.png" alt="Google" class="google-icon">
      <span>Sign in with Google</span>
    </button>

    <a href="index.html" class="back-link">Back to feed</a>
  </div>

  <script type="module">
    import { auth, provider, signInWithPopup } from './firebase.js';

    const loginBtn = document.getElementById('btnGoogleLogin');

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        window.location.href = 'index.html';
      } catch (err) {
        console.error("Sign in failed:", err);
      }
    });
  </script>
</body>
</html>
