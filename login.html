<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - my unistream blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <img src="icons/logo.png" alt="Logo" class="login-logo">
      <img src="icons/name.png" alt="Name" class="login-name">
    </div>
    
    <p class="login-tagline">Join our cozy community space</p>

    <button id="btnGoogleLogin" class="google-login-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.67v3h3.86c2.26-2.09 3.685-5.17 3.685-9.11z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.26v3.09C3.25 21.36 7.35 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.62H1.26C.46 8.23 0 10.06 0 12s.46 3.77 1.26 5.38l4.01-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.25 2.64 1.26 6.62l4.01 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      <span>Sign in with Google</span>
    </button>
  </div>

  <script type="module">
    import { auth, provider, signInWithPopup } from './firebase.js';

    const loginBtn = document.getElementById('btnGoogleLogin');

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        window.location.href = 'index.html';
      } catch (err) {
        console.error("Sign in failed:", err);
      }
    });
  </script>
</body>
</html>
