<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>New Post - my unistream blog</title>
  <link rel="icon" href="icons/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="create-post-body">

  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="header-back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="header-center">
      <span class="header-title">Create Post</span>
    </div>

    <div class="header-right"></div>
  </header>

  <main class="create-post-container">
    <div class="composer-author">
      <img id="composerAvatar" src="icons/stock.png" alt="Avatar" class="composer-avatar" referrerpolicy="no-referrer">
      <div class="composer-author-details">
        <span id="composerName" class="composer-name">User</span>
        <span class="composer-status">Public post</span>
      </div>
    </div>

    <textarea id="postInput" class="post-textarea" placeholder="What's on your mind?" autofocus></textarea>

    <div id="imagePreviewContainer" class="composer-preview-container hidden">
      <img id="imagePreview" src="" alt="Preview" class="composer-preview-img">
      <button type="button" id="btnRemoveImage" class="remove-preview-btn">&times;</button>
    </div>

    <div class="composer-actions">
      <label class="attach-photo-btn" title="Attach image">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#030040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </label>

      <a href="analysis/new-survey.html" class="attach-survey-btn" title="Create a survey">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#030040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </a>

      <button id="btnPublishPost" class="publish-btn" disabled>
        <img src="icons/post.png" alt="Post" class="publish-icon">
        <span>Post</span>
      </button>
    </div>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, db, doc, collection, addDoc, runTransaction, serverTimestamp } from './firebase.js';

    const composerAvatar = document.getElementById('composerAvatar');
    const composerName = document.getElementById('composerName');
    const postInput = document.getElementById('postInput');

    // Instant local cache restore ⚡
    const cachedProfile = JSON.parse(localStorage.getItem('user_cached_profile') || 'null');
    if (cachedProfile) {
      if (cachedProfile.avatarUrl) composerAvatar.src = cachedProfile.avatarUrl;
      if (cachedProfile.displayName) composerName.textContent = cachedProfile.displayName;
    }
    const btnPublishPost = document.getElementById('btnPublishPost');

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      if (user.photoURL) composerAvatar.src = user.photoURL;
      composerName.textContent = user.displayName || 'User';
    });

    const photoInput = document.getElementById('photoInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const btnRemoveImage = document.getElementById('btnRemoveImage');

    let selectedImageBase64 = null;

    function checkCanPublish() {
      const hasText = postInput.value.trim().length > 0;
      const hasImage = Boolean(selectedImageBase64);
      btnPublishPost.disabled = !(hasText || hasImage);
    }

    postInput.addEventListener('input', checkCanPublish);

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.78);
          imagePreview.src = selectedImageBase64;
          imagePreviewContainer.classList.remove('hidden');
          checkCanPublish();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    btnRemoveImage.addEventListener('click', () => {
      selectedImageBase64 = null;
      photoInput.value = '';
      imagePreview.src = '';
      imagePreviewContainer.classList.add('hidden');
      checkCanPublish();
    });

    btnPublishPost.addEventListener('click', async () => {
      const text = postInput.value.trim();
      if ((!text && !selectedImageBase64) || !currentUser) return;

      btnPublishPost.disabled = true;

      try {
        const counterRef = doc(db, 'metadata', 'posts_counter');
        let postNumber = 1;

        await runTransaction(db, async (transaction) => {
          const counterDoc = await transaction.get(counterRef);
          if (counterDoc.exists()) {
            postNumber = (counterDoc.data().count || 0) + 1;
            transaction.update(counterRef, { count: postNumber });
          } else {
            transaction.set(counterRef, { count: 1 });
          }
        });

        await addDoc(collection(db, 'posts'), {
          postNumber: postNumber,
          text: text,
          imageUrl: selectedImageBase64 || null,
          authorId: currentUser.uid,
          authorName: currentUser.displayName || 'User',
          authorAvatar: currentUser.photoURL || 'icons/stock.png',
          createdAt: serverTimestamp()
        });

        window.location.href = 'index.html';
      } catch (err) {
        console.error("Failed to publish post:", err);
        btnPublishPost.disabled = false;
      }
    });
  </script>
</body>
</html>
