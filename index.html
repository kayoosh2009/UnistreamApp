<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>my unistream blog</title>
  <link rel="icon" href="icons/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <img id="userAvatar" src="icons/stock.png" alt="Avatar" class="avatar-header" referrerpolicy="no-referrer">
    </div>

    <div class="header-center">
      <img src="icons/logo.png" alt="Logo" class="header-logo">
      <img src="icons/name.png" alt="Name" class="header-name">
    </div>

    <div class="header-right"></div>
  </header>

  <main class="feed-container" id="feed"></main>

  <nav class="bottom-nav">
    <button class="nav-btn" id="btnProfile">
      <img src="icons/profile.png" alt="Profile">
    </button>
    
    <button class="nav-btn btn-add" id="btnAddPost" onclick="window.location.href='add-post.html'">
      <img src="icons/add.png" alt="Add post">
    </button>
    
    <button class="nav-btn" id="btnMenu">
      <img src="icons/menu.png" alt="Menu">
    </button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content">
      <h3>Menu</h3>
      <ul>
        <li>Settings</li>
        <li>About</li>
        <li id="logoutBtn" style="color: #ff3b30;">Log out</li>
      </ul>
    </div>
  </div>

  <div class="auth-dialog-backdrop" id="authDialogBackdrop">
    <div class="auth-dialog">
      <h3 class="auth-dialog-title">Sign in required</h3>
      <p class="auth-dialog-text">You need to sign in to like this post.</p>
      <div class="auth-dialog-buttons">
        <button id="authDialogCancel" class="auth-dialog-cancel">Cancel</button>
        <a href="login.html" class="auth-dialog-confirm">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</body>
</html>
