<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Settings - my unistream blog</title>
  <link rel="icon" href="icons/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-body">

  <header class="app-header">
    <div class="header-left">
      <a href="profile.html" class="header-back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="header-center">
      <span class="header-title">Settings</span>
    </div>

    <div class="header-right"></div>
  </header>

  <main class="settings-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="settings-sidebar">
      <button class="settings-nav-item active" data-tab="profile">
        <span>Profile</span>
      </button>
      <button class="settings-nav-item" data-tab="account">
        <span>Account</span>
      </button>
      <button class="settings-nav-item" data-tab="appearance">
        <span>Appearance</span>
      </button>
    </aside>

    <!-- RIGHT CONTENT AREA -->
    <section class="settings-content">
      <div class="settings-section-header">
        <h2>Edit Profile</h2>
        <p>Update your public identity and personalize your space</p>
      </div>

      <!-- LIVE PREVIEW CARD -->
      <div class="preview-card-wrapper">
        <span class="preview-label">Live Preview</span>
        <div class="profile-preview-card">
          <div class="preview-banner-box clickable-banner" id="bannerClickZone" title="Click to choose banner photo">
            <img id="previewBanner" src="icons/stock.png" alt="Banner preview" class="preview-banner">
            <div class="banner-camera-badge">📷 Banner</div>
            <div id="bannerLoadingOverlay" class="banner-loading-overlay hidden">
              <div class="loading-ring"></div>
            </div>
            <div class="preview-avatar-box clickable-avatar" id="avatarClickZone" title="Click to choose photo">
              <img id="previewAvatar" src="icons/stock.png" alt="Avatar preview" class="preview-avatar" referrerpolicy="no-referrer">
              <div class="avatar-camera-badge">📷</div>
              <div id="avatarLoadingOverlay" class="avatar-loading-overlay hidden">
                <div class="loading-ring"></div>
              </div>
            </div>
          </div>
          <div class="preview-info-box">
            <h4 id="previewName" class="preview-name">User Name</h4>
            <span id="previewUsername" class="preview-username">@username</span>
          </div>
        </div>
      </div>

      <!-- EDIT FORM -->
      <form id="settingsForm" class="settings-form">
        <div class="form-group">
          <label for="inputName">Display Name</label>
          <input type="text" id="inputName" placeholder="Your visible name" maxlength="32" required>
        </div>

        <div class="form-group">
          <label for="inputUsername">Nickname</label>
          <div class="input-prefix-box">
            <span class="prefix">@</span>
            <input type="text" id="inputUsername" placeholder="username" maxlength="24" required>
          </div>
        </div>

        <div class="form-group">
          <label>Profile Avatar</label>
          <div class="upload-row">
            <label class="file-picker-btn full-width" for="fileAvatarInput">
              <span>Choose Photo from Device (Auto 1:1 Crop)</span>
              <input type="file" id="fileAvatarInput" accept="image/*" hidden>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Profile Banner</label>
          <div class="upload-row">
            <label class="file-picker-btn full-width" for="fileBannerInput">
              <span>Choose Banner from Device (Landscape)</span>
              <input type="file" id="fileBannerInput" accept="image/*" hidden>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="inputCenter">Center / Hub</label>
          <input type="text" id="inputCenter" list="centersList" placeholder="Search or type custom center..." maxlength="50">
          <datalist id="centersList">
            <option value="Tech Innovation Hub">
            <option value="Digital Creative Center">
            <option value="Science & Research Park">
            <option value="University Campus">
            <option value="Startup Incubator">
          </datalist>
        </div>

        <div class="form-group">
          <label for="selectYear">Cohort Year</label>
          <select id="selectYear" class="styled-select">
            <option value="">Select cohort year...</option>
            <option value="Alef">Alef (Year 1)</option>
            <option value="Bet">Bet (Year 2)</option>
            <option value="Gimel">Gimel (Year 3)</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Startup</label>
          <div class="startup-form-row">
            <label class="startup-logo-picker" title="Upload startup logo">
              <img id="previewStartupIcon" src="icons/stock.png" alt="Startup Logo">
              <span class="startup-logo-badge">+ Logo</span>
              <input type="file" id="fileStartupIcon" accept="image/*" hidden>
            </label>
            <input type="text" id="inputStartupName" placeholder="Startup name (optional)" maxlength="40">
          </div>
        </div>

        <div class="form-group verification-box">
          <div class="verification-header">
            <label>Verification Status</label>
            <span id="verificationStatusBadge" class="verified-status-tag">Unverified</span>
          </div>
          <p class="verification-note">Request a verification tick next to your name upon admin approval.</p>
          <button type="button" id="btnRequestVerification" class="btn-verify-request">
            Request Verification Tick
          </button>
        </div>

        <div class="form-actions">
          <button type="submit" id="btnSaveProfile" class="save-settings-btn">
            Save Changes
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- Centered Saved Modal -->
  <div id="saveModal" class="save-modal-backdrop">
    <div class="save-modal-card">
      <img src="icons/end.png" alt="Success" class="save-modal-icon">
      <h3 class="save-modal-title">Saved Successfully</h3>
      <p class="save-modal-subtitle">Your profile changes are now live!</p>
      <button type="button" id="btnCloseSaveModal" class="save-modal-btn">OK</button>
    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      onAuthStateChanged, 
      updateProfile, 
      db, 
      doc, 
      getDoc, 
      setDoc, 
      serverTimestamp 
    } from './firebase.js';

    const previewBanner = document.getElementById('previewBanner');
    const previewAvatar = document.getElementById('previewAvatar');
    const previewName = document.getElementById('previewName');
    const previewUsername = document.getElementById('previewUsername');

    const inputName = document.getElementById('inputName');
    const inputUsername = document.getElementById('inputUsername');
    const inputCenter = document.getElementById('inputCenter');
    const selectYear = document.getElementById('selectYear');
    const inputStartupName = document.getElementById('inputStartupName');
    const fileAvatarInput = document.getElementById('fileAvatarInput');
    const fileBannerInput = document.getElementById('fileBannerInput');
    const fileStartupIcon = document.getElementById('fileStartupIcon');
    const avatarClickZone = document.getElementById('avatarClickZone');
    const bannerClickZone = document.getElementById('bannerClickZone');
    const previewStartupIcon = document.getElementById('previewStartupIcon');
    const bannerLoadingOverlay = document.getElementById('bannerLoadingOverlay');
    const avatarLoadingOverlay = document.getElementById('avatarLoadingOverlay');
    const saveModal = document.getElementById('saveModal');
    const verificationStatusBadge = document.getElementById('verificationStatusBadge');
    const btnRequestVerification = document.getElementById('btnRequestVerification');
    const settingsForm = document.getElementById('settingsForm');
    const btnSaveProfile = document.getElementById('btnSaveProfile');
    const btnCloseSaveModal = document.getElementById('btnCloseSaveModal');

    let currentStartupIconData = '';

    if (avatarClickZone) {
      avatarClickZone.addEventListener('click', () => {
        fileAvatarInput.click();
      });
    }

    if (bannerClickZone) {
      bannerClickZone.addEventListener('click', () => {
        fileBannerInput.click();
      });
    }

    if (btnCloseSaveModal) {
      btnCloseSaveModal.addEventListener('click', () => {
        saveModal.classList.remove('active');
      });
    }

    let currentUser = null;
    let currentAvatarData = '';
    let currentBannerData = '';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;

      // Populate basic auth info
      inputName.value = user.displayName || '';
      previewName.textContent = user.displayName || 'User Name';

      const defaultAvatar = user.photoURL || 'icons/stock.png';
      previewAvatar.src = defaultAvatar;
      currentAvatarData = defaultAvatar;

      const fallbackUsername = user.email ? user.email.split('@')[0] : 'user';
      inputUsername.value = fallbackUsername;
      previewUsername.textContent = '@' + fallbackUsername;

      // Fetch custom profile document
      try {
        const userDocRef = doc(db, 'users', user.uid);
        const userDocSnap = await getDoc(userDocRef);
        if (userDocSnap.exists()) {
          const data = userDocSnap.data();
          if (data.displayName) {
            inputName.value = data.displayName;
            previewName.textContent = data.displayName;
          }
          if (data.username) {
            inputUsername.value = data.username;
            previewUsername.textContent = '@' + data.username;
          }
          if (data.avatarUrl) {
            currentAvatarData = data.avatarUrl;
            previewAvatar.src = data.avatarUrl;
          }
          if (data.bannerUrl) {
            currentBannerData = data.bannerUrl;
            previewBanner.src = data.bannerUrl;
          }
          if (data.center) {
            inputCenter.value = data.center;
          }
          if (data.year) {
            selectYear.value = data.year;
          }
          if (data.startup) {
            if (data.startup.name) inputStartupName.value = data.startup.name;
            if (data.startup.icon) {
              currentStartupIconData = data.startup.icon;
              previewStartupIcon.src = data.startup.icon;
            }
          }
          if (data.isVerified) {
            verificationStatusBadge.textContent = '✓ Verified';
            verificationStatusBadge.className = 'verified-status-tag verified';
            btnRequestVerification.disabled = true;
            btnRequestVerification.textContent = 'Account Verified';
          } else if (data.verificationRequested) {
            verificationStatusBadge.textContent = '⏳ Pending Review';
            verificationStatusBadge.className = 'verified-status-tag pending';
            btnRequestVerification.disabled = true;
            btnRequestVerification.textContent = 'Request Pending';
          }
        }
      } catch (err) {
        console.error("Error reading profile:", err);
      }
    });

    btnRequestVerification.addEventListener('click', async () => {
      if (!currentUser) return;
      btnRequestVerification.disabled = true;
      btnRequestVerification.textContent = 'Requesting...';
      try {
        await setDoc(doc(db, 'users', currentUser.uid), {
          verificationRequested: true,
          verificationRequestedAt: serverTimestamp()
        }, { merge: true });
        verificationStatusBadge.textContent = '⏳ Pending Review';
        verificationStatusBadge.className = 'verified-status-tag pending';
        btnRequestVerification.textContent = 'Request Sent!';
      } catch (err) {
        console.error("Verification request failed:", err);
        btnRequestVerification.disabled = false;
        btnRequestVerification.textContent = 'Request Verification Tick';
      }
    });

    // Real-time live preview listeners
    inputName.addEventListener('input', () => {
      previewName.textContent = inputName.value.trim() || 'User Name';
    });

    inputUsername.addEventListener('input', () => {
      const cleanUser = inputUsername.value.trim().replace(/^@/, '');
      previewUsername.textContent = '@' + (cleanUser || 'username');
    });

    // 1:1 center-crop & base64 converter
    function processSquareAvatar(file, targetSize = 400) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const minSide = Math.min(img.width, img.height);
            const cropX = (img.width - minSide) / 2;
            const cropY = (img.height - minSide) / 2;

            canvas.width = targetSize;
            canvas.height = targetSize;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, cropX, cropY, minSide, minSide, 0, 0, targetSize, targetSize);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Avatar upload with loading animation & 1:1 square crop
    fileAvatarInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      avatarLoadingOverlay.classList.remove('hidden');

      try {
        const croppedBase64 = await processSquareAvatar(file, 400);
        currentAvatarData = croppedBase64;
        previewAvatar.src = croppedBase64;
      } catch (err) {
        console.error("Image processing error:", err);
      } finally {
        avatarLoadingOverlay.classList.add('hidden');
      }
    });

    // Wide landscape banner processing (not 1:1)
    fileBannerInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      bannerLoadingOverlay.classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const targetW = 900;
          const targetH = 300; // 3:1 cinematic landscape banner

          canvas.width = targetW;
          canvas.height = targetH;
          const ctx = canvas.getContext('2d');

          const imgRatio = img.width / img.height;
          const targetRatio = targetW / targetH;
          let renderW, renderH, offsetX, offsetY;

          if (imgRatio > targetRatio) {
            renderH = targetH;
            renderW = img.width * (targetH / img.height);
            offsetX = (targetW - renderW) / 2;
            offsetY = 0;
          } else {
            renderW = targetW;
            renderH = img.height * (targetW / img.width);
            offsetX = 0;
            offsetY = (targetH - renderH) / 2;
          }

          ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
          currentBannerData = canvas.toDataURL('image/jpeg', 0.75);
          previewBanner.src = currentBannerData;
          bannerLoadingOverlay.classList.add('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Startup logo upload
    fileStartupIcon.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 100;
          canvas.height = 100;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - minSide)/2, (img.height - minSide)/2, minSide, minSide, 0, 0, 100, 100);
          currentStartupIconData = canvas.toDataURL('image/png');
          previewStartupIcon.src = currentStartupIconData;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Save profile changes & show success modal
    settingsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      btnSaveProfile.disabled = true;
      btnSaveProfile.textContent = 'Saving...';

      const newDisplayName = inputName.value.trim();
      const newUsername = inputUsername.value.trim().replace(/^@/, '');

      try {
        // Safe Auth profile update without passing long base64 strings ✨
        const authPayload = { displayName: newDisplayName };
        if (currentAvatarData && !currentAvatarData.startsWith('data:') && currentAvatarData.length < 1500) {
          authPayload.photoURL = currentAvatarData;
        }
        await updateProfile(currentUser, authPayload);

        const centerVal = inputCenter ? inputCenter.value.trim() : '';
        const startupNameVal = inputStartupName ? inputStartupName.value.trim() : '';
        const yearVal = selectYear ? selectYear.value : '';

        await setDoc(doc(db, 'users', currentUser.uid), {
          displayName: newDisplayName,
          username: newUsername,
          avatarUrl: currentAvatarData,
          bannerUrl: currentBannerData,
          center: centerVal,
          year: yearVal,
          startup: {
            name: startupNameVal,
            icon: currentStartupIconData || ''
          },
          updatedAt: serverTimestamp()
        }, { merge: true });

        // Update local cache immediately ⚡
        localStorage.setItem('user_cached_profile', JSON.stringify({
          displayName: newDisplayName,
          username: newUsername,
          avatarUrl: currentAvatarData,
          bannerUrl: currentBannerData,
          center: centerVal,
          year: yearVal,
          startupName: startupNameVal
        }));

        btnSaveProfile.disabled = false;
        btnSaveProfile.textContent = 'Save Changes';
        saveModal.classList.add('active');
      } catch (err) {
        console.error("Failed to save settings:", err);
        btnSaveProfile.disabled = false;
        btnSaveProfile.textContent = 'Save Changes';
      }
    });
  </script>
</body>
</html>
