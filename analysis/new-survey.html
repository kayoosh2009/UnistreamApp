<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>New Survey - my unistream blog</title>
  <link rel="icon" href="../icons/logo.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="analytics-body">

  <header class="app-header">
    <div class="header-left">
      <a href="dashboard.html" class="header-back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="header-center">
      <span class="header-title">Create Survey</span>
    </div>

    <div class="header-right"></div>
  </header>

  <main class="new-survey-container">
    <form id="newSurveyForm" class="new-survey-form">
      <div class="form-group">
        <label for="surveyQuestion">Poll Question</label>
        <input type="text" id="surveyQuestion" placeholder="Ask your question..." maxlength="120" required autofocus>
      </div>

      <div class="form-group">
        <label>Options</label>
        <div id="optionsList" class="options-inputs-list">
          <div class="option-input-row">
            <input type="text" class="survey-option-input" placeholder="Option 1" required maxlength="60">
          </div>
          <div class="option-input-row">
            <input type="text" class="survey-option-input" placeholder="Option 2" required maxlength="60">
          </div>
        </div>
        <button type="button" id="btnAddOption" class="add-option-btn">+ Add another option</button>
      </div>

      <div class="form-actions">
        <button type="submit" id="btnPublishSurvey" class="publish-survey-btn">
          Publish Survey
        </button>
      </div>
    </form>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, db, collection, addDoc, serverTimestamp } from '../firebase.js';

    const newSurveyForm = document.getElementById('newSurveyForm');
    const optionsList = document.getElementById('optionsList');
    const btnAddOption = document.getElementById('btnAddOption');
    const btnPublishSurvey = document.getElementById('btnPublishSurvey');
    const surveyQuestion = document.getElementById('surveyQuestion');

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = '../login.html';
        return;
      }
      currentUser = user;
    });

    btnAddOption.addEventListener('click', () => {
      const currentInputs = optionsList.querySelectorAll('.option-input-row');
      if (currentInputs.length >= 6) return;

      const row = document.createElement('div');
      row.className = 'option-input-row';
      row.innerHTML = `
        <input type="text" class="survey-option-input" placeholder="Option ${currentInputs.length + 1}" required maxlength="60">
        <button type="button" class="remove-option-btn">&times;</button>
      `;

      row.querySelector('.remove-option-btn').addEventListener('click', () => {
        row.remove();
      });

      optionsList.appendChild(row);
    });

    newSurveyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const question = surveyQuestion.value.trim();
      const optionInputs = optionsList.querySelectorAll('.survey-option-input');
      const options = Array.from(optionInputs)
        .map(input => input.value.trim())
        .filter(val => val.length > 0);

      if (!question || options.length < 2) return;

      btnPublishSurvey.disabled = true;
      btnPublishSurvey.textContent = 'Publishing...';

      try {
        await addDoc(collection(db, 'surveys'), {
          question: question,
          options: options,
          votes: {},
          voters: {},
          totalVotes: 0,
          authorId: currentUser.uid,
          authorName: currentUser.displayName || 'User',
          authorAvatar: currentUser.photoURL || '../icons/stock.png',
          createdAt: serverTimestamp()
        });

        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error("Survey creation failed:", err);
        btnPublishSurvey.disabled = false;
        btnPublishSurvey.textContent = 'Publish Survey';
      }
    });
  </script>
</body>
</html>
